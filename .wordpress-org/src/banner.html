<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:772px;height:250px;overflow:hidden}
  body{
    display:flex;align-items:center;gap:34px;padding:0 56px;
    background:linear-gradient(115deg,#1d2327 0%,#2c3338 62%,#3a2f24 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:#fff;position:relative;
  }
  .glow{position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,184,73,.22) 0%,rgba(240,184,73,0) 70%)}
  .mark{width:104px;height:104px;flex:none;position:relative}
  .txt{position:relative}
  h1{font-size:52px;line-height:1;letter-spacing:-1.5px;font-weight:700}
  h1 span{color:#f0b849}
  p{margin-top:12px;font-size:19px;color:#c3c4c7;letter-spacing:.2px}
  .tag{margin-top:16px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;color:#1d2327;background:#f0b849;padding:4px 10px;border-radius:3px}
</style>
<div class="glow"></div>
<div class="mark"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Pizza slice angled like a paper plane: "pizza" + "pilot" -->
  <path d="M50 8 L88 78 A44 44 0 0 1 12 78 Z" fill="#f0b849"/>
  <path d="M50 8 L88 78 A44 44 0 0 1 50 88 Z" fill="#e0a838"/>
  <circle cx="50" cy="46" r="7" fill="#d63638"/>
  <circle cx="34" cy="66" r="5.5" fill="#d63638"/>
  <circle cx="65" cy="66" r="5.5" fill="#d63638"/>
</svg>
</div>
<div class="txt">
  <h1>Pizza<span>Pilot</span></h1>
  <p>Delivery time slots &amp; kitchen orders for WooCommerce</p>
  <span class="tag">Placeholder artwork</span>
</div>
